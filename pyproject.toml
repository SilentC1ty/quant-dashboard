[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-dashboard"
version = "0.1.0"
description = "Local multi-strategy dashboard for quant paper-trading data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.63,<2",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
include = ["quant_dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
